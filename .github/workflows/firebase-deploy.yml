name: Test and Deploy to Firebase

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: ci-placeholder-api-key
      VITE_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: ci-placeholder
      VITE_FIREBASE_STORAGE_BUCKET: ci-placeholder.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: "123456789"
      VITE_FIREBASE_APP_ID: 1:123456789:web:abcdef123456
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run all tests
        run: npm run test:ci

  deploy_hosting:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Deploy to Firebase Hosting (live)
        run: npx firebase-tools deploy --project "$VITE_FIREBASE_PROJECT_ID" --only hosting --non-interactive
        env:
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}

  deploy_firestore:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Preflight debug and permission checks (Firestore)
        shell: bash
        run: |
          set -euo pipefail

          echo "Deploy target project: ${VITE_FIREBASE_PROJECT_ID:-<unset>}"
          if [[ -z "${VITE_FIREBASE_PROJECT_ID:-}" ]]; then
            echo "::error::VITE_FIREBASE_PROJECT_ID is not set. Add it in repository secrets."
            exit 1
          fi

          echo "Credential file path present: ${GOOGLE_GHA_CREDS_PATH:+yes}"
          if ! gcloud auth application-default print-access-token >/dev/null 2>&1; then
            echo "::error::Unable to get Application Default Credentials access token after Workload Identity authentication."
            exit 1
          fi
          echo "ADC token check passed."

          echo "Active account(s):"
          gcloud auth list || true
          echo "Checking Service Usage access for firestore.googleapis.com (diagnostic, non-fatal)..."
          if gcloud services describe firestore.googleapis.com --project "$VITE_FIREBASE_PROJECT_ID" --format='value(name,state)'; then
            echo "Service Usage check passed."
          else
            echo "::warning::Service Usage describe returned non-zero (see error above). Continuing to deploy; firebase-tools will surface any real permission errors."
          fi

      - name: Deploy Firestore rules and indexes
        run: npx firebase-tools deploy --project "$VITE_FIREBASE_PROJECT_ID" --only firestore:rules,firestore:indexes --non-interactive
